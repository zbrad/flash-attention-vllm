# tuned/devices/rtx50.conf — static device config for RTX 50 (Blackwell
# consumer, x86_64).
#
# "a" suffix targets the Blackwell family-specific SASS variant -- required
# for RTX 50-specific tensor core instructions not present in the
# compatible/generic sm_120 target (same rationale as GB10's 12.1a,
# matching the convention already used across every other repo this
# session). Not yet empirically tested for flash-attention specifically --
# the original, real, published GB10 build used bare "12.1" (no "a"),
# likely to sidestep cuda_archs_loose_intersection()'s unreliable "a"-
# suffix matching (see CMakeLists.txt's FA2_TUNED_ARCH comment) rather than
# because the accelerated variant was known to be wrong. FA2_TUNED_ARCH
# bypasses that matching function entirely for tuned builds, so this should
# be safe, but confirm with a real build before trusting it blindly.

GPU_TUNED_VARIANT="rtx50"
GPU_TUNED_PLATFORM="x86_64"
GPU_TUNED_FA2_ARCH="12.0a"
GPU_TUNED_HW_LABEL="RTX 5080/5090 (Blackwell consumer, SM 120)"
